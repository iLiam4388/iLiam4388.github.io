<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iLiam Mini Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#063c61,#000715 75%);color:white;font:16px Verdana,Arial;text-align:center;min-height:100vh}h1{color:#8ff;text-shadow:0 0 22px cyan;font-size:clamp(30px,6vw,56px);margin:22px 0 8px}.subtitle{color:#adf}.menu{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:20px auto;max-width:850px}button{border:2px solid cyan;border-radius:12px;background:#052b45;color:white;font:700 15px Verdana;padding:12px;cursor:pointer;touch-action:manipulation}button:hover,button.active{background:#067c96;box-shadow:0 0 14px cyan}.panel{max-width:680px;margin:16px auto;padding:20px;border:2px solid #00eaff;border-radius:22px;background:#001629;box-shadow:0 0 25px #00ffff55;min-height:370px}.score{color:#ffec75;font-size:21px;font-weight:bold;margin:12px}#play{position:relative;min-height:230px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;overflow:hidden}#play button{font-size:24px}#play .tile{width:72px;height:72px;font-size:30px}#play .target{position:absolute;border-radius:50%;width:64px;height:64px;background:#ffcf33;color:#111}input{padding:12px;font-size:22px;width:140px;background:#00111f;color:white;border:2px solid cyan;border-radius:12px}#arena{position:relative;width:min(100%,420px);height:230px;background:linear-gradient(#001d34,#000);border:2px solid cyan;overflow:hidden;touch-action:none}#ship{position:absolute;bottom:8px;left:48%;font-size:35px} .rock{position:absolute;font-size:28px}.pulse{animation:pulse 2s infinite}@keyframes pulse{50%{text-shadow:0 0 38px #ff0;transform:scale(1.04)}}a{color:cyan} @media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<h1 class="pulse">⚡ iLIAM MINI ARCADE ⚡</h1><div class="subtitle">Five games • No ads • Tap or click to play</div><nav class="menu" id="menu"></nav><section class="panel"><h2 id="title"></h2><p id="instructions"></p><div class="score" id="score"></div><div id="play"></div><p id="message" aria-live="polite"></p><button id="restart">↻ Restart</button></section><p><a href="games.html">← Back to Games</a></p>
<script>
const names=['🎯 Target Tap','⚡ Reaction Test','🔢 Number Hunt','🧠 Memory Match','🚀 Meteor Dodge'];let game=0,points=0,timer=null,interval=null,started=0,deck=[],opened=[],matched=0,ship=190,rocks=[],running=false;
const $=id=>document.getElementById(id),play=$('play'),score=$('score'),msg=$('message');
function clear(){clearTimeout(timer);clearInterval(interval);timer=null;interval=null;running=false;play.replaceChildren();msg.textContent='';points=0}
function btn(text,fn,cls=''){let b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}
function show(n){clear();game=n;$('title').textContent=names[n];document.querySelectorAll('#menu button').forEach((b,i)=>b.classList.toggle('active',i===n));if(n===0)target();if(n===1)reaction();if(n===2)number();if(n===3)memory();if(n===4)dodge()}
function target(){let left=20;$('instructions').textContent='Tap as many moving targets as you can in 20 seconds!';function spawn(){play.replaceChildren();let b=btn('★',()=>{points++;score.textContent='Hits: '+points;spawn()},'target');b.style.left=Math.random()*Math.max(0,play.clientWidth-75)+'px';b.style.top=Math.random()*155+'px';play.append(b)}score.textContent='Time: 20s • Hits: 0';spawn();interval=setInterval(()=>{left--;score.textContent='Time: '+left+'s • Hits: '+points;if(left<=0){clearInterval(interval);play.replaceChildren();msg.textContent='Final score: '+points+' hits!'}},1000)}
function reaction(){$('instructions').textContent='Wait for GO, then tap as fast as possible. Early taps restart the round.';let ready=false;let b=btn('WAIT…',()=>{if(!ready){clearTimeout(timer);msg.textContent='Too early! Try again.';reactionRound()}else{let ms=Math.round(performance.now()-started);score.textContent=ms+' ms';b.textContent='PLAY AGAIN';b.onclick=reactionRound;ready=false}});play.append(b);function reactionRound(){ready=false;b.textContent='WAIT…';b.style.background='#6d1635';timer=setTimeout(()=>{ready=true;started=performance.now();b.textContent='GO!';b.style.background='#007d52'},1200+Math.random()*2500)}reactionRound()}
function number(){$('instructions').textContent='Guess the secret number from 1 to 100.';let secret=1+Math.floor(Math.random()*100),tries=0;let input=document.createElement('input');input.type='number';input.min=1;input.max=100;input.placeholder='1–100';let guess=()=>{let v=Number(input.value);if(!input.value||v<1||v>100){msg.textContent='Enter a number from 1 to 100.';return}tries++;msg.textContent=v===secret?'🎉 Correct in '+tries+' guesses!':v<secret?'Higher! ⬆️':'Lower! ⬇️';score.textContent='Guesses: '+tries};play.append(input,btn('GUESS',guess));input.onkeydown=e=>{if(e.key==='Enter')guess()}}
function memory(){$('instructions').textContent='Find all eight matching pairs.';let icons=['🌙','⭐','🔥','💎','🚀','👾','🎮','⚡'];deck=[...icons,...icons].sort(()=>Math.random()-.5);opened=[];matched=0;play.style.maxWidth='410px';play.style.margin='auto';deck.forEach((v,i)=>{let b=btn('?',()=>{if(opened.length===2||b.disabled)return;b.textContent=v;opened.push({b,v});if(opened.length===2){let [a,c]=opened;if(a.v===c.v){a.b.disabled=c.b.disabled=true;matched+=2;opened=[];score.textContent=matched/2+' / 8 pairs';if(matched===16)msg.textContent='🎉 All pairs found!'}else timer=setTimeout(()=>{a.b.textContent=c.b.textContent='?';opened=[]},650)}},'tile');play.append(b)});score.textContent='0 / 8 pairs'}
function dodge(){$('instructions').textContent='Move your spaceship left and right to dodge falling meteors. Drag or use arrow keys.';let arena=document.createElement('div');arena.id='arena';let craft=document.createElement('div');craft.id='ship';craft.textContent='🚀';arena.append(craft);play.append(arena);ship=190;rocks=[];points=0;running=true;let frame=0;function move(x){ship=Math.max(0,Math.min(arena.clientWidth-40,x));craft.style.left=ship+'px'}arena.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX-arena.getBoundingClientRect().left-20)};arena.onpointerdown=e=>move(e.clientX-arena.getBoundingClientRect().left-20);window.onkeydown=e=>{if(game!==4)return;if(e.key==='ArrowLeft')move(ship-24);if(e.key==='ArrowRight')move(ship+24)};interval=setInterval(()=>{frame++;if(frame%7===0){let r=document.createElement('div');r.className='rock';r.textContent='☄️';r.style.left=Math.random()*(arena.clientWidth-35)+'px';r.dataset.y='-35';arena.append(r);rocks.push(r)}for(let r of [...rocks]){let y=Number(r.dataset.y)+5+points/100;r.dataset.y=y;r.style.top=y+'px';let x=parseFloat(r.style.left);if(y>170&&y<220&&Math.abs(x-ship)<29){clearInterval(interval);running=false;msg.textContent='💥 Game over! You survived '+points+' ticks.';return}if(y>240){r.remove();rocks.splice(rocks.indexOf(r),1)}}points++;score.textContent='Survival: '+points},50)}
names.forEach((name,i)=>$('menu').append(btn(name,()=>show(i))));$('restart').onclick=()=>show(game);show(0);
</script></html>
