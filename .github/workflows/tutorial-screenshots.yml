name: Capture iLiam tutorial screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/tutorial-fixtures/share-chooser.mjs'
      - '.github/workflows/tutorial-screenshots.yml'
permissions:
  contents: write
concurrency:
  group: tutorial-screenshots-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install capture dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 three@0.180.0
          sudo apt-get update -qq
          sudo apt-get install -y xvfb imagemagick tesseract-ocr
      - name: Capture with the installed Chrome browser
        env:
          CAPTURE_HEADED: '1'
          CAPTURE_WORKERS: '1'
          CAPTURE_LESSONS: '23'
        run: |
          export CAPTURE_CHROMIUM="$(command -v google-chrome)"
          xvfb-run -a -s '-screen 0 1440x1000x24' node tools/capture-tutorial-screens.mjs
      - name: Preserve capture results on the verification branch
        if: always() && github.ref_name == 'qa/tutorial-capture-nov24'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f /tmp/chooser-debug.png; then cp /tmp/chooser-debug.png tools/chooser-debug.png; git add tools/chooser-debug.png; fi
          git add images/tutorials
          if ! git diff --cached --quiet; then git commit -m 'Record native chooser capture results'; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: iliam-tutorial-screens
          path: images/tutorials/*.png
