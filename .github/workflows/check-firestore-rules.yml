name: Check Firebase rules readiness (read-only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase Admin dependencies
        working-directory: scripts
        run: npm install --omit=dev --no-package-lock
      - name: Check permissions and compare live rules (no deployment)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-rules-readiness.mjs
