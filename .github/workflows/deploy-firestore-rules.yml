name: Deploy Firebase Firestore rules

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iliam-firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rules
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase Admin dependencies
        working-directory: scripts
        run: npm install --omit=dev --no-package-lock
      - name: Validate and deploy Firestore rules through Firebase Rules API
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy-firestore-rules.mjs
      - name: Verify live Firebase rules match GitHub
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/verify-deployed-rules.mjs
