<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games - iLiam</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Verdana,Arial,sans-serif;background:radial-gradient(circle at top,#00345f 0,#00152c 28%,#000813 72%);color:#fff}
header{position:sticky;top:0;z-index:10;background:#02050bcc;border-bottom:3px solid cyan;box-shadow:0 0 25px cyan;backdrop-filter:blur(10px)}
.topbar{width:min(1500px,calc(100% - 28px));margin:auto;display:flex;align-items:center;gap:18px;padding:14px 0;flex-wrap:wrap}
.brand{font-size:30px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 0 10px cyan,0 0 24px cyan;text-decoration:none}
.home-btn{margin-left:auto;padding:11px 18px;border-radius:14px;background:linear-gradient(#57c7ff,#006eff);color:white;text-decoration:none;font-weight:900;box-shadow:0 0 15px cyan}
.search{flex:1;min-width:220px;max-width:520px;padding:13px 16px;border:2px solid cyan;border-radius:16px;background:#001225;color:white;outline:none;box-shadow:inset 0 0 12px #00ffff33}
.search:focus{box-shadow:0 0 18px cyan,inset 0 0 12px #00ffff33}
.hero{width:min(1500px,calc(100% - 28px));margin:28px auto 18px;padding:22px 24px;border:2px solid cyan;border-radius:22px;background:linear-gradient(135deg,#012a4fdd,#000818dd);box-shadow:0 0 25px #00ffff66}
.hero h1{margin:0 0 8px;font-size:clamp(34px,6vw,62px);text-shadow:0 0 12px cyan,0 0 30px cyan}
.hero p{margin:0;color:#c7faff;font-size:16px}
.status{width:min(1500px,calc(100% - 28px));margin:0 auto 14px;color:#9ffcff}
.games-grid{width:min(1500px,calc(100% - 28px));margin:0 auto 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));grid-auto-flow:dense;grid-auto-rows:170px;gap:16px}
.game-card{appearance:none;width:100%;padding:0;text-align:left;font:inherit;position:relative;overflow:hidden;border-radius:22px;background:#08101b;border:2px solid #00eaff;box-shadow:0 0 14px #00eaff66;cursor:pointer;text-decoration:none;color:white;transition:.18s ease;min-height:0}
.game-card:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 0 18px cyan,0 0 36px #00ffff77}
.game-card.featured{grid-column:span 2;grid-row:span 2;border:3px solid #ffe600;box-shadow:0 0 18px #ffe600,0 0 42px #ffbf00aa}
.game-card img{width:100%;height:100%;object-fit:cover;display:block;background:#07111f}
.game-card::after{content:"";position:absolute;inset:auto 0 0;height:48%;background:linear-gradient(transparent,#000d 62%,#000 100%);pointer-events:none}
.game-info{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.game-name{font-size:17px;font-weight:900;text-shadow:0 2px 8px #000}
.game-desc{margin-top:4px;font-size:12px;color:#d7fbff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px #000}
.featured-badge{position:absolute;top:12px;right:12px;z-index:3;padding:7px 10px;border-radius:999px;background:#ffe600;color:#241a00;font-size:12px;font-weight:900;box-shadow:0 0 10px yellow,0 0 24px orange}
.empty{grid-column:1/-1;padding:42px;border:2px dashed cyan;border-radius:20px;text-align:center;color:#bdfbff;background:#00122588}
footer{padding:24px;text-align:center;color:cyan;border-top:2px solid #00ffff55;background:#000}
@media(max-width:760px){.games-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:150px;gap:12px}.game-card.featured{grid-column:span 2;grid-row:span 2}.home-btn{margin-left:0}.search{order:3;max-width:none;width:100%}}
@media(max-width:430px){.games-grid{grid-auto-rows:135px}.game-name{font-size:14px}.game-desc{display:none}}

.player-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,5,12,.94);display:none;align-items:center;justify-content:center;padding:18px}
.player-overlay.open{display:flex}
.player-shell{width:min(1500px,100%);height:min(900px,95vh);display:flex;flex-direction:column;background:#000;border:2px solid cyan;border-radius:18px;overflow:hidden;box-shadow:0 0 22px cyan,0 0 60px #00ffff55}
.player-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#03111e;border-bottom:2px solid #00ffff99}
.player-title{font-weight:900;color:white;text-shadow:0 0 8px cyan;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.player-btn{border:2px solid cyan;background:#001b2d;color:#fff;padding:9px 13px;border-radius:10px;font-weight:900;cursor:pointer;box-shadow:0 0 10px #00ffff55}
.player-btn:hover{box-shadow:0 0 16px cyan}
.player-frame{width:100%;height:100%;border:0;background:#000;flex:1}
@media(max-width:600px){.player-overlay{padding:0}.player-shell{height:100vh;border-radius:0;border-left:0;border-right:0}.player-bar{flex-wrap:wrap}.player-title{width:100%;flex-basis:100%}}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <a class="brand" href="index.html">iLIAM GAMES</a>
    <input id="search" class="search" type="search" placeholder="Search games..." autocomplete="off">
    <a class="home-btn" href="index.html">← HOME</a>
  </div>
</header>

<section class="hero">
  <h1>GAMES</h1>
  <p>Pick a game and play. Featured games are bigger and glow gold.</p>
</section>
<div class="status" id="status">Connecting to Firebase…</div>
<main class="games-grid" id="gamesGrid"></main>
<footer>© 2026 iLiam</footer>


<div class="player-overlay" id="playerOverlay" aria-hidden="true">
  <div class="player-shell" id="playerShell">
    <div class="player-bar">
      <div class="player-title" id="playerTitle">Game</div>
      <button class="player-btn" id="reloadGame" type="button">↻ Reload</button>
      <button class="player-btn" id="fullscreenGame" type="button">⛶ Full Screen</button>
      <button class="player-btn" id="closeGame" type="button">✕ Close</button>
    </div>
    <iframe id="gameFrame" class="player-frame" title="Game player" allow="autoplay; fullscreen; gamepad" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getFirestore,collection,onSnapshot,query,orderBy}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyD7QF6z6e2psZzQwkmO7LLkc4twcNrZWEg",
  authDomain:"iliam-4d0c9.firebaseapp.com",
  projectId:"iliam-4d0c9",
  storageBucket:"iliam-4d0c9.firebasestorage.app",
  messagingSenderId:"612892694546",
  appId:"1:612892694546:web:067283f408405e3a5860cb",
  measurementId:"G-ZKPXXYLX5Q"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const grid=document.getElementById('gamesGrid');
const status=document.getElementById('status');
const search=document.getElementById('search');
const playerOverlay=document.getElementById('playerOverlay');
const playerShell=document.getElementById('playerShell');
const playerTitle=document.getElementById('playerTitle');
const gameFrame=document.getElementById('gameFrame');
const closeGame=document.getElementById('closeGame');
const fullscreenGame=document.getElementById('fullscreenGame');
const reloadGame=document.getElementById('reloadGame');
let currentGameUrl='';
let games=[];

function safeUrl(value){
  try{
    const u=new URL(value,location.href);
    return ['http:','https:'].includes(u.protocol)?u.href:null;
  }catch{return null}
}


function openGame(game){
  currentGameUrl=game.url;
  playerTitle.textContent=game.name;
  gameFrame.src=game.url;
  playerOverlay.classList.add('open');
  playerOverlay.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}

function closePlayer(){
  playerOverlay.classList.remove('open');
  playerOverlay.setAttribute('aria-hidden','true');
  gameFrame.src='about:blank';
  currentGameUrl='';
  document.body.style.overflow='';
}

closeGame.addEventListener('click',closePlayer);
playerOverlay.addEventListener('click',e=>{if(e.target===playerOverlay)closePlayer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&playerOverlay.classList.contains('open'))closePlayer()});
reloadGame.addEventListener('click',()=>{if(currentGameUrl){gameFrame.src='about:blank';requestAnimationFrame(()=>gameFrame.src=currentGameUrl)}});
fullscreenGame.addEventListener('click',async()=>{
  try{
    if(!document.fullscreenElement)await playerShell.requestFullscreen();
    else await document.exitFullscreen();
  }catch(err){console.error('Fullscreen failed',err)}
});

function render(){
  const term=search.value.trim().toLowerCase();
  const filtered=games.filter(g=>!term||g.name.toLowerCase().includes(term)||(g.description||'').toLowerCase().includes(term));
  grid.replaceChildren();
  if(!filtered.length){
    const empty=document.createElement('div');
    empty.className='empty';
    empty.textContent=games.length?'No games match your search.':'No games have been added yet.';
    grid.append(empty);return;
  }
  for(const g of filtered){
    const a=document.createElement('button');
    a.type='button';
    a.className='game-card'+(g.featured?' featured':'');
    a.addEventListener('click',()=>openGame(g));

    const img=document.createElement('img');
    img.src=g.image||'images/favicon.png';
    img.alt=g.name;
    img.loading='lazy';
    img.onerror=()=>{img.onerror=null;img.src='images/favicon.png'};
    a.append(img);

    if(g.featured){
      const badge=document.createElement('div');
      badge.className='featured-badge';
      badge.textContent='★ FEATURED';
      a.append(badge);
    }

    const info=document.createElement('div');
    info.className='game-info';
    const name=document.createElement('div');name.className='game-name';name.textContent=g.name;
    const desc=document.createElement('div');desc.className='game-desc';desc.textContent=g.description||'Play now';
    info.append(name,desc);a.append(info);grid.append(a);
  }
}

search.addEventListener('input',render);

let q;
try{q=query(collection(db,'games'),orderBy('order','asc'));}
catch{q=collection(db,'games');}

onSnapshot(q,snap=>{
  games=snap.docs.map(d=>{
    const x=d.data();
    return{
      id:d.id,
      name:String(x.name||'Untitled Game'),
      description:String(x.description||''),
      image:safeUrl(x.image)||'images/favicon.png',
      url:safeUrl(x.url)||'#',
      featured:x.featured===true,
      enabled:x.enabled!==false,
      order:Number.isFinite(x.order)?x.order:9999
    };
  }).filter(g=>g.enabled&&g.url!=='#').sort((a,b)=>(a.order-b.order)||(Number(b.featured)-Number(a.featured))||a.name.localeCompare(b.name));
  localStorage.setItem('iliamGamesCache',JSON.stringify(games));
  status.textContent=`${games.length} game${games.length===1?'':'s'} loaded`;
  render();
},err=>{
  try{games=JSON.parse(localStorage.getItem('iliamGamesCache')||'[]')}catch{games=[]}
  status.textContent=games.length?'Firebase is unavailable — showing cached games.':'Could not load games from Firebase.';
  render();
  console.error(err);
});
</script>
</body>
</html>
