<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games - iLiam</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Verdana,Arial,sans-serif;background:radial-gradient(circle at top,#00345f 0,#00152c 28%,#000813 72%);color:#fff}
header{position:sticky;top:0;z-index:10;background:#02050bcc;border-bottom:3px solid cyan;box-shadow:0 0 25px cyan;backdrop-filter:blur(10px)}
.topbar{width:min(1500px,calc(100% - 28px));margin:auto;display:flex;align-items:center;gap:18px;padding:14px 0;flex-wrap:wrap}
.brand{font-size:30px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 0 10px cyan,0 0 24px cyan;text-decoration:none}
.home-btn{margin-left:auto;padding:11px 18px;border-radius:14px;background:linear-gradient(#57c7ff,#006eff);color:white;text-decoration:none;font-weight:900;box-shadow:0 0 15px cyan}
.search{flex:1;min-width:220px;max-width:520px;padding:13px 16px;border:2px solid cyan;border-radius:16px;background:#001225;color:white;outline:none;box-shadow:inset 0 0 12px #00ffff33}
.search:focus{box-shadow:0 0 18px cyan,inset 0 0 12px #00ffff33}
.hero{width:min(1500px,calc(100% - 28px));margin:28px auto 18px;padding:22px 24px;border:2px solid cyan;border-radius:22px;background:linear-gradient(135deg,#012a4fdd,#000818dd);box-shadow:0 0 25px #00ffff66}
.hero h1{margin:0 0 8px;font-size:clamp(34px,6vw,62px);text-shadow:0 0 12px cyan,0 0 30px cyan}
.hero p{margin:0;color:#c7faff;font-size:16px}
.status{width:min(1500px,calc(100% - 28px));margin:0 auto 14px;color:#9ffcff}
.games-grid{width:min(1500px,calc(100% - 28px));margin:0 auto 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));grid-auto-flow:dense;grid-auto-rows:170px;gap:16px}
.game-card{appearance:none;width:100%;padding:0;text-align:left;font:inherit;position:relative;overflow:hidden;border-radius:22px;background:#08101b;border:2px solid #00eaff;box-shadow:0 0 14px #00eaff66;cursor:pointer;text-decoration:none;color:white;transition:.18s ease;min-height:0}
.game-card:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 0 18px cyan,0 0 36px #00ffff77}
.game-card.featured{grid-column:span 2;grid-row:span 2;border:3px solid #ffe600;box-shadow:0 0 18px #ffe600,0 0 42px #ffbf00aa}
.game-card img{width:100%;height:100%;object-fit:cover;display:block;background:#07111f}
.game-card::after{content:"";position:absolute;inset:auto 0 0;height:48%;background:linear-gradient(transparent,#000d 62%,#000 100%);pointer-events:none}
.game-info{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.game-name{font-size:17px;font-weight:900;text-shadow:0 2px 8px #000}
.game-desc{margin-top:4px;font-size:12px;color:#d7fbff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px #000}
.featured-badge{position:absolute;top:12px;right:12px;z-index:3;padding:7px 10px;border-radius:999px;background:#ffe600;color:#241a00;font-size:12px;font-weight:900;box-shadow:0 0 10px yellow,0 0 24px orange}
.empty{grid-column:1/-1;padding:42px;border:2px dashed cyan;border-radius:20px;text-align:center;color:#bdfbff;background:#00122588}
footer{padding:24px;text-align:center;color:cyan;border-top:2px solid #00ffff55;background:#000}
@media(max-width:760px){.games-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:150px;gap:12px}.game-card.featured{grid-column:span 2;grid-row:span 2}.home-btn{margin-left:0}.search{order:3;max-width:none;width:100%}}
@media(max-width:430px){.games-grid{grid-auto-rows:135px}.game-name{font-size:14px}.game-desc{display:none}}

.bottom-admin-wrap{width:min(1500px,calc(100% - 28px));margin:0 auto 24px;display:flex;justify-content:center}
.admin-btn{padding:11px 16px;border:2px solid #ffe600;border-radius:14px;background:#211900;color:#fff7a8;font-weight:900;cursor:pointer;box-shadow:0 0 12px #ffe60066}
.admin-btn:hover{box-shadow:0 0 18px #ffe600}
.admin-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,5,12,.96);display:none;align-items:center;justify-content:center;padding:18px}
.admin-overlay.open{display:flex}
.admin-panel{width:min(760px,100%);max-height:94vh;overflow:auto;background:#03111e;border:2px solid #ffe600;border-radius:20px;box-shadow:0 0 24px #ffe60088;padding:22px}
.admin-panel h2{margin:0 0 14px;color:#fff7a8;text-shadow:0 0 12px #ffe600}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.admin-field{display:flex;flex-direction:column;gap:6px}
.admin-field.full{grid-column:1/-1}
.admin-field label{font-size:13px;font-weight:900;color:#dffcff}
.admin-field input,.admin-field textarea{width:100%;padding:11px 12px;border:2px solid #00eaff;border-radius:11px;background:#001225;color:#fff;font:inherit;outline:none}
.admin-field textarea{min-height:90px;resize:vertical}
.admin-checks{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}
.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.admin-action{border:2px solid cyan;background:#001b2d;color:#fff;padding:10px 14px;border-radius:10px;font-weight:900;cursor:pointer}
.admin-action.gold{border-color:#ffe600;background:#2b2100;color:#fff7a8}
.admin-action.danger{border-color:#ff5a70;background:#2b0008}
.admin-message{margin-top:12px;color:#aefcff;min-height:20px}
.admin-login-note{font-size:12px;color:#b9dbe8;margin:0 0 14px}
@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-field.full{grid-column:auto}}

.player-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,5,12,.94);display:none;align-items:center;justify-content:center;padding:18px}
.player-overlay.open{display:flex}
.player-shell{width:min(1500px,100%);height:min(900px,95vh);display:flex;flex-direction:column;background:#000;border:2px solid cyan;border-radius:18px;overflow:hidden;box-shadow:0 0 22px cyan,0 0 60px #00ffff55}
.player-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#03111e;border-bottom:2px solid #00ffff99}
.player-title{font-weight:900;color:white;text-shadow:0 0 8px cyan;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.player-btn{border:2px solid cyan;background:#001b2d;color:#fff;padding:9px 13px;border-radius:10px;font-weight:900;cursor:pointer;box-shadow:0 0 10px #00ffff55}
.player-btn:hover{box-shadow:0 0 16px cyan}
.player-frame{width:100%;height:100%;border:0;background:#000;flex:1}
@media(max-width:600px){.player-overlay{padding:0}.player-shell{height:100vh;border-radius:0;border-left:0;border-right:0}.player-bar{flex-wrap:wrap}.player-title{width:100%;flex-basis:100%}}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <a class="brand" href="index.html">iLIAM GAMES</a>
    <input id="search" class="search" type="search" placeholder="Search games..." autocomplete="off">
    <a class="home-btn" href="index.html">← HOME</a>
  </div>
</header>

<section class="hero">
  <h1>GAMES</h1>
  <p>Pick a game and play! AND NO ADS!</p>
</section>
<div class="status" id="status">Connecting to Firebase…</div>
<main class="games-grid" id="gamesGrid"></main>
<div class="bottom-admin-wrap"><button class="admin-btn" id="adminButton" type="button">⚙ ADMIN</button></div>
<footer>© 2026 iLiam</footer>


<div class="admin-overlay" id="adminOverlay" aria-hidden="true">
  <div class="admin-panel">
    <h2>iLiam Games Admin</h2>
    <div id="adminLoginView">
      <p class="admin-login-note">Enter the admin password to unlock the game editor.</p>
      <div class="admin-grid">
        <div class="admin-field full"><label for="adminPassword">Admin password</label><input id="adminPassword" type="password" autocomplete="off" placeholder="Password"></div>
      </div>
      <div class="admin-actions">
        <button class="admin-action gold" id="adminLogin" type="button">Unlock Admin</button>
        <button class="admin-action danger" id="adminCloseLogin" type="button">Close</button>
      </div>
    </div>

    <div id="adminEditorView" hidden>
      <div class="admin-grid">
        <div class="admin-field"><label for="gameName">Name</label><input id="gameName" value="New Game"></div>
        <div class="admin-field"><label for="gameOrder">Order</label><input id="gameOrder" type="number" value="9999"></div>
        <div class="admin-field full"><label for="gameUrl">Game iframe URL</label><input id="gameUrl" type="url" placeholder="https://example.com/game.embed"></div>
        <div class="admin-field full"><label for="gameImage">Image URL</label><input id="gameImage" placeholder="https://example.com/image.png"></div>
        <div class="admin-field full"><label for="gameDescription">Description</label><textarea id="gameDescription" placeholder="Game description"></textarea></div>
      </div>
      <div class="admin-checks">
        <label><input id="gameFeatured" type="checkbox"> Featured</label>
        <label><input id="gameEnabled" type="checkbox"> Enabled</label>
      </div>
      <div class="admin-actions">
        <button class="admin-action gold" id="createGame" type="button">＋ Add Game</button>
        <button class="admin-action" id="createBlankGame" type="button">Create Blank Draft</button>
        <button class="admin-action" id="resetGameForm" type="button">Reset</button>
        <button class="admin-action danger" id="adminLogout" type="button">Lock Admin</button>
        <button class="admin-action danger" id="adminClose" type="button">Close</button>
      </div>
    </div>
    <div class="admin-message" id="adminMessage"></div>
  </div>
</div>

<div class="player-overlay" id="playerOverlay" aria-hidden="true">
  <div class="player-shell" id="playerShell">
    <div class="player-bar">
      <div class="player-title" id="playerTitle">Game</div>
      <button class="player-btn" id="reloadGame" type="button">↻ Reload</button>
      <button class="player-btn" id="fullscreenGame" type="button">⛶ Full Screen</button>
      <button class="player-btn" id="closeGame" type="button">✕ Close</button>
    </div>
    <iframe id="gameFrame" class="player-frame" title="Game player" allow="autoplay; fullscreen; gamepad" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getFirestore,collection,onSnapshot,query,orderBy,addDoc}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyD7QF6z6e2psZzQwkmO7LLkc4twcNrZWEg",
  authDomain:"iliam-4d0c9.firebaseapp.com",
  projectId:"iliam-4d0c9",
  storageBucket:"iliam-4d0c9.firebasestorage.app",
  messagingSenderId:"612892694546",
  appId:"1:612892694546:web:067283f408405e3a5860cb",
  measurementId:"G-ZKPXXYLX5Q"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

// Change this password to whatever you want.
// NOTE: this is a client-side convenience lock, not strong security.
const ADMIN_PASSWORD="admin123";
let adminUnlocked=false;
const grid=document.getElementById('gamesGrid');
const status=document.getElementById('status');
const search=document.getElementById('search');
const playerOverlay=document.getElementById('playerOverlay');
const playerShell=document.getElementById('playerShell');
const playerTitle=document.getElementById('playerTitle');
const gameFrame=document.getElementById('gameFrame');
const closeGame=document.getElementById('closeGame');
const fullscreenGame=document.getElementById('fullscreenGame');
const reloadGame=document.getElementById('reloadGame');
const adminButton=document.getElementById('adminButton');
const adminOverlay=document.getElementById('adminOverlay');
const adminLoginView=document.getElementById('adminLoginView');
const adminEditorView=document.getElementById('adminEditorView');
const adminPassword=document.getElementById('adminPassword');
const adminLogin=document.getElementById('adminLogin');
const adminCloseLogin=document.getElementById('adminCloseLogin');
const adminClose=document.getElementById('adminClose');
const adminLogout=document.getElementById('adminLogout');
const adminMessage=document.getElementById('adminMessage');
const gameName=document.getElementById('gameName');
const gameUrl=document.getElementById('gameUrl');
const gameImage=document.getElementById('gameImage');
const gameDescription=document.getElementById('gameDescription');
const gameFeatured=document.getElementById('gameFeatured');
const gameEnabled=document.getElementById('gameEnabled');
const gameOrder=document.getElementById('gameOrder');
const createGame=document.getElementById('createGame');
const createBlankGame=document.getElementById('createBlankGame');
const resetGameForm=document.getElementById('resetGameForm');
let currentGameUrl='';
let games=[];


function openAdmin(){
  adminOverlay.classList.add('open');
  adminOverlay.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  adminLoginView.hidden=adminUnlocked;
  adminEditorView.hidden=!adminUnlocked;
  adminPassword.focus();
}
function closeAdmin(){
  adminOverlay.classList.remove('open');
  adminOverlay.setAttribute('aria-hidden','true');
  adminMessage.textContent='';
  adminPassword.value='';
  if(!playerOverlay.classList.contains('open'))document.body.style.overflow='';
}
function resetAdminForm(){
  gameName.value='New Game';gameUrl.value='';gameImage.value='';gameDescription.value='';
  gameFeatured.checked=false;gameEnabled.checked=false;gameOrder.value='9999';
}
async function writeGame(data){
  if(!adminUnlocked)throw new Error('Admin password required.');
  return addDoc(collection(db,'games'),data);
}
adminButton.addEventListener('click',openAdmin);
adminCloseLogin.addEventListener('click',closeAdmin);
adminClose.addEventListener('click',closeAdmin);
adminOverlay.addEventListener('click',e=>{if(e.target===adminOverlay)closeAdmin()});
adminLogin.addEventListener('click',()=>{
  if(adminPassword.value===ADMIN_PASSWORD){
    adminUnlocked=true;
    adminPassword.value='';
    adminLoginView.hidden=true;
    adminEditorView.hidden=false;
    adminMessage.textContent='Admin unlocked.';
  }else{
    adminMessage.textContent='Wrong password.';
    adminPassword.select();
  }
});
adminPassword.addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin.click()});
adminLogout.addEventListener('click',()=>{
  adminUnlocked=false;
  resetAdminForm();
  adminLoginView.hidden=false;
  adminEditorView.hidden=true;
  adminMessage.textContent='Admin locked.';
});
resetGameForm.addEventListener('click',resetAdminForm);
createGame.addEventListener('click',async()=>{
  adminMessage.textContent='Adding game…';
  try{
    const data={
      name:gameName.value.trim()||'New Game',
      url:gameUrl.value.trim(),
      image:gameImage.value.trim(),
      description:gameDescription.value.trim(),
      featured:gameFeatured.checked,
      enabled:gameEnabled.checked,
      order:Number(gameOrder.value)||9999
    };
    const ref=await writeGame(data);
    adminMessage.textContent='Game added: '+ref.id;
    resetAdminForm();
  }catch(err){adminMessage.textContent='Could not add game: '+(err.code||err.message)}
});
createBlankGame.addEventListener('click',async()=>{
  adminMessage.textContent='Creating blank draft…';
  try{
    const ref=await writeGame({name:'New Game',url:'',image:'',description:'',featured:false,enabled:false,order:9999});
    adminMessage.textContent='Blank disabled draft created: '+ref.id;
  }catch(err){adminMessage.textContent='Could not create draft: '+(err.code||err.message)}
});

function safeUrl(value){
  try{
    const u=new URL(value,location.href);
    return ['http:','https:'].includes(u.protocol)?u.href:null;
  }catch{return null}
}


function openGame(game){
  currentGameUrl=game.url;
  playerTitle.textContent=game.name;
  gameFrame.src=game.url;
  playerOverlay.classList.add('open');
  playerOverlay.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}

function closePlayer(){
  playerOverlay.classList.remove('open');
  playerOverlay.setAttribute('aria-hidden','true');
  gameFrame.src='about:blank';
  currentGameUrl='';
  document.body.style.overflow='';
}

closeGame.addEventListener('click',closePlayer);
playerOverlay.addEventListener('click',e=>{if(e.target===playerOverlay)closePlayer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&playerOverlay.classList.contains('open'))closePlayer()});
reloadGame.addEventListener('click',()=>{if(currentGameUrl){gameFrame.src='about:blank';requestAnimationFrame(()=>gameFrame.src=currentGameUrl)}});
fullscreenGame.addEventListener('click',async()=>{
  try{
    if(!document.fullscreenElement)await playerShell.requestFullscreen();
    else await document.exitFullscreen();
  }catch(err){console.error('Fullscreen failed',err)}
});

function render(){
  const term=search.value.trim().toLowerCase();
  const filtered=games.filter(g=>!term||g.name.toLowerCase().includes(term)||(g.description||'').toLowerCase().includes(term));
  grid.replaceChildren();
  if(!filtered.length){
    const empty=document.createElement('div');
    empty.className='empty';
    empty.textContent=games.length?'No games match your search.':'No games have been added yet.';
    grid.append(empty);return;
  }
  for(const g of filtered){
    const a=document.createElement('button');
    a.type='button';
    a.className='game-card'+(g.featured?' featured':'');
    a.addEventListener('click',()=>openGame(g));

    const img=document.createElement('img');
    img.src=g.image||'images/favicon.png';
    img.alt=g.name;
    img.loading='lazy';
    img.onerror=()=>{img.onerror=null;img.src='images/favicon.png'};
    a.append(img);

    if(g.featured){
      const badge=document.createElement('div');
      badge.className='featured-badge';
      badge.textContent='★ FEATURED';
      a.append(badge);
    }

    const info=document.createElement('div');
    info.className='game-info';
    const name=document.createElement('div');name.className='game-name';name.textContent=g.name;
    const desc=document.createElement('div');desc.className='game-desc';desc.textContent=g.description||'Play now';
    info.append(name,desc);a.append(info);grid.append(a);
  }
}

search.addEventListener('input',render);

let q;
try{q=query(collection(db,'games'),orderBy('order','asc'));}
catch{q=collection(db,'games');}

onSnapshot(q,snap=>{
  games=snap.docs.map(d=>{
    const x=d.data();
    return{
      id:d.id,
      name:String(x.name||'Untitled Game'),
      description:String(x.description||''),
      image:safeUrl(x.image)||'images/favicon.png',
      url:safeUrl(x.url)||'#',
      featured:x.featured===true,
      enabled:x.enabled!==false,
      order:Number.isFinite(x.order)?x.order:9999
    };
  }).filter(g=>g.enabled&&g.url!=='#').sort((a,b)=>(a.order-b.order)||(Number(b.featured)-Number(a.featured))||a.name.localeCompare(b.name));
  localStorage.setItem('iliamGamesCache',JSON.stringify(games));
  status.textContent=`${games.length} game${games.length===1?'':'s'} loaded`;
  render();
},err=>{
  try{games=JSON.parse(localStorage.getItem('iliamGamesCache')||'[]')}catch{games=[]}
  status.textContent=games.length?'Firebase is unavailable — showing cached games.':'Could not load games from Firebase.';
  render();
  console.error(err);
});
</script>
</body>
</html>
