<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Code · iLiam</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;text-align:center;background:radial-gradient(circle at top,#073b59,#000714 75%);font:16px Verdana;color:white;padding:20px}h1{color:cyan;text-shadow:0 0 20px cyan}main{max-width:680px;margin:auto;padding:20px;border:2px solid cyan;border-radius:20px;background:#001b2b}button{margin:6px;padding:12px;border:2px solid cyan;border-radius:10px;background:#05364a;color:white;cursor:pointer;font-weight:bold}button:focus-visible{outline:3px solid yellow}input{padding:12px;font-size:22px;width:140px}canvas{width:100%;max-width:420px;touch-action:none}#score{color:#ffdf4e;font-weight:bold;font-size:22px}a{color:cyan}</style></head><body><h1>⚡ Color Code</h1><main><p>Match the color name, not the color of its letters.</p><p id="score"></p><h2 id='word'></h2><div id='choices'></div><p id='feedback'></p></main><p><a href="../../games.html">← Games</a> · <a href="../../mini-arcade.html">Mini Arcade</a></p><script>let colors=['RED','BLUE','GREEN','YELLOW'],inks=['#ff4566','#3daaff','#44ee88','#ffe04d'],correct=0,round=0;function next(){let a=Math.floor(Math.random()*4),b=Math.floor(Math.random()*4);document.querySelector('#word').textContent=colors[a];document.querySelector('#word').style.color=inks[b];document.querySelector('#choices').replaceChildren();colors.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{round++;if(i===a)correct++;document.querySelector('#score').textContent=correct+' / '+round;document.querySelector('#feedback').textContent=i===a?'Correct!':'Try the next one!';next()};document.querySelector('#choices').append(b)})}next();</script></body></html>
