<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Painter · iLiam</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;text-align:center;background:radial-gradient(circle at top,#073b59,#000714 75%);font:16px Verdana;color:white;padding:20px}h1{color:cyan;text-shadow:0 0 20px cyan}main{max-width:680px;margin:auto;padding:20px;border:2px solid cyan;border-radius:20px;background:#001b2b}button{margin:6px;padding:12px;border:2px solid cyan;border-radius:10px;background:#05364a;color:white;cursor:pointer;font-weight:bold}button:focus-visible{outline:3px solid yellow}input{padding:12px;font-size:22px;width:140px}canvas{width:100%;max-width:420px;touch-action:none}#score{color:#ffdf4e;font-weight:bold;font-size:22px}a{color:cyan}</style></head><body><h1>⚡ Pixel Painter</h1><main><p>Draw glowing pixel art on a 16 × 16 canvas.</p><p id="score"></p><div id='palette'></div><div id='pixels'></div><button id='erase'>Erase</button><button id='clear'>Clear</button></main><p><a href="../../games.html">← Games</a> · <a href="../../mini-arcade.html">Mini Arcade</a></p><script>let colors=['#00ffff','#ff4d89','#ffdb4b','#7cff73','#a87aff','#ffffff'],selected=colors[0],painting=false;let pal=document.querySelector('#palette'),grid=document.querySelector('#pixels');grid.style.cssText='display:grid;grid-template-columns:repeat(16,1fr);width:min(90vw,384px);margin:15px auto;touch-action:none;border:2px solid cyan';colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.style.width='45px';b.style.height='40px';b.onclick=()=>selected=c;pal.append(b)});for(let i=0;i<256;i++){let b=document.createElement('div');b.style.cssText='aspect-ratio:1;border:1px solid #12304a;background:#001021';b.onpointerdown=e=>{painting=true;b.style.background=selected;b.setPointerCapture(e.pointerId)};b.onpointerenter=()=>{if(painting)b.style.background=selected};b.onpointerup=()=>painting=false;grid.append(b)}document.body.onpointerup=()=>painting=false;document.querySelector('#erase').onclick=()=>selected='#001021';document.querySelector('#clear').onclick=()=>[...grid.children].forEach(b=>b.style.background='#001021');document.querySelector('#score').textContent='256 pixels · 6 colors';</script></body></html>
