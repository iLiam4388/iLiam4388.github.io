<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Catch · iLiam</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;text-align:center;background:radial-gradient(circle at top,#073b59,#000714 75%);font:16px Verdana;color:white;padding:20px}h1{color:cyan;text-shadow:0 0 20px cyan}main{max-width:680px;margin:auto;padding:20px;border:2px solid cyan;border-radius:20px;background:#001b2b}button{margin:6px;padding:12px;border:2px solid cyan;border-radius:10px;background:#05364a;color:white;cursor:pointer;font-weight:bold}button:focus-visible{outline:3px solid yellow}input{padding:12px;font-size:22px;width:140px}canvas{width:100%;max-width:420px;touch-action:none}#score{color:#ffdf4e;font-weight:bold;font-size:22px}a{color:cyan}</style></head><body><h1>⚡ Orbit Catch</h1><main><p>Catch the glowing stars before they escape.</p><p id="score"></p><canvas id='c' width='420' height='360'></canvas><p>Move your paddle with your finger or mouse.</p></main><p><a href="../../games.html">← Games</a> · <a href="../../mini-arcade.html">Mini Arcade</a></p><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),p=180,stars=[],score=0,miss=0,t=0;function move(e){p=Math.max(0,Math.min(350,(e.clientX-c.getBoundingClientRect().left)*420/c.getBoundingClientRect().width-35))}c.onpointermove=move;c.onpointerdown=move;function tick(){x.fillStyle='#001426';x.fillRect(0,0,420,360);if(t++%32===0)stars.push({x:Math.random()*400+10,y:0,v:2+Math.random()*2});x.fillStyle='#00ffff';x.fillRect(p,330,70,12);for(let s of stars){s.y+=s.v;x.fillStyle='#ffdf50';x.beginPath();x.arc(s.x,s.y,9,0,7);x.fill();if(s.y>327&&s.y<345&&s.x>p&&s.x<p+70){score++;s.y=500}if(s.y>365&&s.y<450){miss++;s.y=500}}stars=stars.filter(s=>s.y<450);document.querySelector('#score').textContent='Caught '+score+' · Missed '+miss;requestAnimationFrame(tick)}tick();</script></body></html>
