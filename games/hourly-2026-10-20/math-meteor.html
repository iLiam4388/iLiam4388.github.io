<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Meteor · iLiam</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;text-align:center;background:radial-gradient(circle at top,#073b59,#000714 75%);font:16px Verdana;color:white;padding:20px}h1{color:cyan;text-shadow:0 0 20px cyan}main{max-width:680px;margin:auto;padding:20px;border:2px solid cyan;border-radius:20px;background:#001b2b}button{margin:6px;padding:12px;border:2px solid cyan;border-radius:10px;background:#05364a;color:white;cursor:pointer;font-weight:bold}button:focus-visible{outline:3px solid yellow}input{padding:12px;font-size:22px;width:140px}canvas{width:100%;max-width:420px;touch-action:none}#score{color:#ffdf4e;font-weight:bold;font-size:22px}a{color:cyan}</style></head><body><h1>⚡ Math Meteor</h1><main><p>Solve as many equations as you can.</p><p id="score"></p><h2 id='question'></h2><input id='answer' type='number' placeholder='Answer'><button id='submit'>Submit</button><p id='feedback'></p></main><p><a href="../../games.html">← Games</a> · <a href="../../mini-arcade.html">Mini Arcade</a></p><script>let a,b,op,score=0,round=0;function next(){a=1+Math.floor(Math.random()*20);b=1+Math.floor(Math.random()*20);op=Math.random()<.5?'+':'−';document.querySelector('#question').textContent=a+' '+op+' '+b+' = ?';document.querySelector('#answer').value='';document.querySelector('#answer').focus()}function check(){let v=document.querySelector('#answer').value;if(v==='')return;round++;if(Number(v)===(op==='+'?a+b:a-b)){score++;document.querySelector('#feedback').textContent='Correct!'}else document.querySelector('#feedback').textContent='Answer: '+(op==='+'?a+b:a-b);document.querySelector('#score').textContent=score+' / '+round;next()}document.querySelector('#submit').onclick=check;document.querySelector('#answer').onkeydown=e=>{if(e.key==='Enter')check()};next();</script></body></html>
