<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequence Spark · iLiam</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;text-align:center;background:radial-gradient(circle at top,#073b59,#000714 75%);font:16px Verdana;color:white;padding:20px}h1{color:cyan;text-shadow:0 0 20px cyan}main{max-width:680px;margin:auto;padding:20px;border:2px solid cyan;border-radius:20px;background:#001b2b}button{margin:6px;padding:12px;border:2px solid cyan;border-radius:10px;background:#05364a;color:white;cursor:pointer;font-weight:bold}button:focus-visible{outline:3px solid yellow}input{padding:12px;font-size:22px;width:140px}canvas{width:100%;max-width:420px;touch-action:none}#score{color:#ffdf4e;font-weight:bold;font-size:22px}a{color:cyan}</style></head><body><h1>⚡ Sequence Spark</h1><main><p>Remember and repeat an increasingly long light sequence.</p><p id="score"></p><div id='pads'></div><button id='start'>Start / Restart</button><p id='feedback'></p></main><p><a href="../../games.html">← Games</a> · <a href="../../mini-arcade.html">Mini Arcade</a></p><script>let seq=[],input=[],busy=true;const colors=['#ff426b','#2d9fff','#43d881','#e9c633'],pads=document.querySelector('#pads');colors.forEach((c,i)=>{let b=document.createElement('button');b.textContent='◆';b.style.background=c;b.style.width='90px';b.style.height='90px';b.onclick=()=>{if(busy)return;input.push(i);flash(i);if(input[input.length-1]!==seq[input.length-1]){busy=true;document.querySelector('#feedback').textContent='Game over! Press restart.'}else if(input.length===seq.length){busy=true;setTimeout(next,700)}};pads.append(b)});function flash(i){let b=pads.children[i];b.style.filter='brightness(2.7)';setTimeout(()=>b.style.filter='',300)}function next(){input=[];seq.push(Math.floor(Math.random()*4));document.querySelector('#score').textContent='Level '+seq.length;document.querySelector('#feedback').textContent='Watch the pattern';busy=true;seq.forEach((n,i)=>setTimeout(()=>flash(n),500+i*650));setTimeout(()=>{busy=false;document.querySelector('#feedback').textContent='Your turn!'},500+seq.length*650)}document.querySelector('#start').onclick=()=>{seq=[];next()};</script></body></html>
