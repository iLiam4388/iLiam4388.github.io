<!DOCTYPE html>
<html>
<head>
<title>Other - iLiam</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(to bottom,#001133,#000011);
  font-family:Verdana,Arial,sans-serif;
  color:white;
  text-align:center;
}
.page-title{
  font-size:64px;
  font-weight:900;
  letter-spacing:2px;
  margin:40px 15px 15px;
  text-shadow:0 0 10px cyan,0 0 25px cyan,0 0 50px cyan;
}
.back-btn{
  display:inline-block;
  margin:15px 0 35px;
  padding:14px 34px;
  border-radius:18px;
  background:linear-gradient(to bottom,#59d7ff,#0077ff);
  color:white;
  text-decoration:none;
  font-weight:bold;
  font-size:20px;
  box-shadow:0 0 10px cyan,0 0 25px #00aaff;
}
.divider{
  height:4px;
  background:cyan;
  box-shadow:0 0 15px cyan;
}
.empty-card{
  width:70%;
  max-width:750px;
  margin:70px auto;
  padding:45px 30px;
  background:linear-gradient(to bottom,#ffffff,#dddddd);
  color:black;
  border-radius:24px;
  box-shadow:0 0 25px cyan;
  box-sizing:border-box;
}
.empty-card h2{
  font-size:34px;
  margin-top:0;
  text-shadow:0 0 8px cyan;
}
.empty-card p{
  font-size:20px;
  line-height:1.6;
}
.rider-btn{
  display:inline-block;
  margin-top:12px;
  padding:17px 38px;
  border-radius:18px;
  background:linear-gradient(120deg,#643cff 0%,#a94cff 48%,#ff4fd8 100%);
  color:white;
  text-decoration:none;
  font-size:21px;
  font-weight:900;
  letter-spacing:.4px;
  box-shadow:0 0 12px #8f5cff,0 0 28px rgba(174,76,255,.75),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}
.rider-btn:hover{
  transform:translateY(-3px) scale(1.02);
  filter:brightness(1.08);
  box-shadow:0 0 16px #a779ff,0 0 38px rgba(214,79,255,.9),inset 0 1px 0 rgba(255,255,255,.45);
}
.rider-btn:active{transform:translateY(0) scale(.99)}
.rider-btn:focus-visible{outline:3px solid white;outline-offset:5px}
.footer{
  padding:22px;
  color:cyan;
}
@media(max-width:700px){
  .page-title{font-size:44px}
  .empty-card{width:80%}
  .rider-btn{font-size:18px;padding:15px 28px}
}
@media(max-width:320px){
  .page-title{font-size:30px;margin-top:25px}
  .back-btn{font-size:13px;padding:12px 16px}
  .empty-card{width:calc(100% - 20px);padding:22px 12px;margin:30px auto}
  .empty-card h2{font-size:24px}
  .empty-card p{font-size:14px}
  .rider-btn{font-size:12px;padding:15px 10px;letter-spacing:0}
}
</style>
</head>
<body>

<h1 class="page-title">OTHER</h1>
<a class="back-btn" href="index.html">← BACK HOME</a>
<div class="divider"></div>

<div class="empty-card">
  <h2>3D RIDER</h2>
  <p>Build, edit, and explore 3D creations right in your browser.</p>
  <a class="rider-btn" href="3d-rider.html">OPEN 3D RIDER →</a>
</div>

<div class="empty-card">
  <h2>2D RIDER</h2>
  <p>Create 2D shapes, text, animation, physics, metaballs, and liquids in a touch-friendly studio.</p>
  <a class="rider-btn" href="2d-rider.html">OPEN 2D RIDER →</a>
</div>

<div class="divider"></div>
<div class="footer">© 2026 iLiam</div>

</body>
</html>
