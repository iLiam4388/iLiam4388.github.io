<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community - iLiam</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#001133,#000011);font-family:Verdana,Arial;color:#fff;text-align:center}button,input,textarea{font:inherit}.page-title{margin:40px 15px 10px;font-size:clamp(42px,8vw,64px);font-weight:900;letter-spacing:2px;text-shadow:0 0 10px cyan,0 0 25px cyan,0 0 50px cyan}.back-btn{display:inline-block;margin:15px 0 35px;padding:14px 34px;border-radius:18px;background:linear-gradient(#59d7ff,#0077ff);color:#fff;text-decoration:none;font-size:20px;font-weight:bold;box-shadow:0 0 10px cyan,0 0 25px #00aaff}.divider{height:4px;background:cyan;box-shadow:0 0 15px cyan}.community{width:min(950px,calc(100% - 30px));margin:40px auto}.status{margin-bottom:22px;padding:14px 18px;border:2px solid cyan;border-radius:16px;background:#001432cc;box-shadow:0 0 18px #00ffff66;text-align:left}.post-box,.post{margin-bottom:28px;padding:22px;background:linear-gradient(#ff9cff,#d100ff);border:3px solid #fff;border-radius:24px;box-shadow:0 0 25px #ff66ff,0 0 50px #00ffff55;text-align:left}.post-box h2{margin-top:0;text-shadow:0 0 10px #fff}input,textarea{width:100%;padding:14px;border:3px solid #fff;border-radius:14px;outline:none;background:#fff;color:#111}textarea{height:100px;resize:vertical}input:focus,textarea:focus{box-shadow:0 0 15px cyan}.post-btn,.small-btn{margin-top:14px;padding:13px 26px;border:0;border-radius:15px;background:linear-gradient(#66ff99,#00aa44);color:#fff;font-weight:bold;box-shadow:0 0 15px lime,0 0 25px cyan;cursor:pointer}.small-btn{margin:0;padding:9px 14px;background:#0004;border:2px solid #fff;box-shadow:none}button:hover{filter:brightness(1.12);transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait;transform:none}.user{font-size:18px;font-weight:bold;color:#eaffff;text-shadow:0 0 8px cyan}.username{margin-left:7px;font-size:12px;opacity:.8}.time{margin-left:8px;font-size:13px;color:#dff}.post-text{margin-top:14px;font-size:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.empty{padding:28px;border:2px dashed cyan;border-radius:18px;color:#cfffff}.error{background:#7f1838;border-color:#ffb2ca}.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:#000014db;backdrop-filter:blur(8px)}.modal.show{display:grid}.modal-card{width:min(520px,100%);padding:26px;border:3px solid #fff;border-radius:24px;background:linear-gradient(#ff9cff,#b800e8);box-shadow:0 0 30px #ff66ff,0 0 60px cyan;text-align:left}.modal-card label{display:block;margin:15px 0 7px;font-weight:bold}.hint{font-size:13px;opacity:.9;line-height:1.45}.footer{padding:22px;color:cyan}@media(max-width:600px){.post-box,.post{padding:17px;border-radius:18px}.small-btn{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<h1 class="page-title">COMMUNITY</h1>
<a class="back-btn" href="index.html">← BACK HOME</a>
<div class="divider"></div>
<main class="community">
<div class="status" id="status">Connecting to Firebase…</div>
<section class="post-box">
<h2>Post Something</h2>
<textarea id="postText" maxlength="500" placeholder="What's happening on iLiam?"></textarea>
<button class="post-btn" id="postButton" type="button" disabled>POST</button>
</section>
<section id="posts"><div class="empty">Loading posts…</div></section>
</main>
<div class="divider"></div>
<footer class="footer">© 2026 iLiam</footer>

<div class="modal" id="profileModal">
<div class="modal-card">
<h2>Create your iLiam profile</h2>
<p class="hint">No email or password is needed. This account stays connected to this browser. Clearing browser data may reset it.</p>
<label for="usernameInput">Private username</label>
<input id="usernameInput" maxlength="20" autocomplete="off" placeholder="Example: geometryking">
<label for="nicknameInput">Public nickname</label>
<input id="nicknameInput" maxlength="24" autocomplete="off" placeholder="Example: Liam">
<button class="post-btn" id="saveProfileButton" type="button">CREATE PROFILE</button>
<p class="hint" id="profileError"></p>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getFirestore,doc,getDoc,addDoc,collection,query,orderBy,limit,onSnapshot,serverTimestamp,runTransaction}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyD7QF6z6e2psZzQwkmO7LLkc4twcNrZWEg",
 authDomain:"iliam-4d0c9.firebaseapp.com",
 projectId:"iliam-4d0c9",
 storageBucket:"iliam-4d0c9.firebasestorage.app",
 messagingSenderId:"612892694546",
 appId:"1:612892694546:web:067283f408405e3a5860cb",
 measurementId:"G-ZKPXXYLX5Q"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const statusBox=$("status"),postText=$("postText"),postButton=$("postButton"),postsElement=$("posts"),profileModal=$("profileModal"),usernameInput=$("usernameInput"),nicknameInput=$("nicknameInput"),saveProfileButton=$("saveProfileButton"),profileError=$("profileError");
let currentUser=null,currentProfile=null,stopPostsListener=null;

const cleanUsername=v=>v.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
const escapeHtml=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function formatTime(t){if(!t?.toDate)return"just now";return t.toDate().toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function setStatus(m,e=false){statusBox.textContent=m;statusBox.classList.toggle("error",e)}

onAuthStateChanged(auth,async user=>{
 try{
  if(!user){await signInAnonymously(auth);return}
  currentUser=user;
  const snap=await getDoc(doc(db,"profiles",user.uid));
  if(!snap.exists()){profileModal.classList.add("show");setStatus("Create a username and nickname to join.");return}
  currentProfile=snap.data();profileModal.classList.remove("show");postButton.disabled=false;
  setStatus(`Signed in as ${currentProfile.nickname} · @${currentProfile.username}`);
  listenForPosts();
 }catch(error){setStatus("Firebase error: "+error.message,true)}
});

saveProfileButton.addEventListener("click",async()=>{
 profileError.textContent="";
 const username=cleanUsername(usernameInput.value),nickname=nicknameInput.value.trim();
 if(username.length<3){profileError.textContent="Username must be at least 3 characters.";return}
 if(!nickname){profileError.textContent="Enter a nickname.";return}
 saveProfileButton.disabled=true;
 try{
  const usernameRef=doc(db,"usernames",username),profileRef=doc(db,"profiles",currentUser.uid);
  await runTransaction(db,async tx=>{
   const taken=await tx.get(usernameRef);
   if(taken.exists())throw new Error("That username is already taken.");
   tx.set(usernameRef,{uid:currentUser.uid,createdAt:serverTimestamp()});
   tx.set(profileRef,{username,nickname,createdAt:serverTimestamp()});
  });
  currentProfile={username,nickname};
  profileModal.classList.remove("show");postButton.disabled=false;
  setStatus(`Signed in as ${nickname} · @${username}`);listenForPosts();
 }catch(error){profileError.textContent=error.message}
 finally{saveProfileButton.disabled=false}
});

postButton.addEventListener("click",async()=>{
 const text=postText.value.trim();
 if(!text)return alert("Write something first.");
 postButton.disabled=true;postButton.textContent="POSTING…";
 try{
  await addDoc(collection(db,"posts"),{uid:currentUser.uid,username:currentProfile.username,nickname:currentProfile.nickname,text:text.slice(0,500),upvotes:0,createdAt:serverTimestamp()});
  postText.value="";
 }catch(error){alert("Could not post: "+error.message)}
 finally{postButton.disabled=false;postButton.textContent="POST"}
});

function listenForPosts(){
 if(stopPostsListener)stopPostsListener();
 const q=query(collection(db,"posts"),orderBy("createdAt","desc"),limit(50));
 stopPostsListener=onSnapshot(q,snap=>{
  if(snap.empty){postsElement.innerHTML='<div class="empty">No posts yet. Be the first!</div>';return}
  postsElement.innerHTML="";
  snap.forEach(s=>{
   const p=s.data(),article=document.createElement("article");article.className="post";
   const saved=JSON.parse(localStorage.getItem("iliam_saved_posts")||"[]"),isSaved=saved.includes(s.id);
   article.innerHTML=`<div><span class="user">${escapeHtml(p.nickname)}</span><span class="username">@${escapeHtml(p.username)}</span><span class="time">• ${escapeHtml(formatTime(p.createdAt))}</span></div><div class="post-text">${escapeHtml(p.text)}</div><div class="actions"><button class="small-btn upvote-btn" type="button">⬆ Upvote ${Number(p.upvotes||0)}</button><button class="small-btn save-btn" type="button">${isSaved?"★ Saved":"☆ Save"}</button></div>`;
   article.querySelector(".upvote-btn").onclick=()=>upvotePost(s.id);
   article.querySelector(".save-btn").onclick=e=>toggleSavedPost(s.id,e.currentTarget);
   postsElement.appendChild(article);
  });
 },error=>setStatus("Could not load posts: "+error.message,true));
}

async function upvotePost(postId){
 const postRef=doc(db,"posts",postId),voteRef=doc(db,"posts",postId,"votes",currentUser.uid);
 try{
  await runTransaction(db,async tx=>{
   const vote=await tx.get(voteRef),post=await tx.get(postRef);
   if(!post.exists())throw new Error("Post not found.");
   if(vote.exists())throw new Error("You already upvoted this.");
   tx.set(voteRef,{uid:currentUser.uid,createdAt:serverTimestamp()});
   tx.update(postRef,{upvotes:Number(post.data().upvotes||0)+1});
  });
 }catch(error){alert(error.message)}
}

function toggleSavedPost(id,button){
 const saved=new Set(JSON.parse(localStorage.getItem("iliam_saved_posts")||"[]"));
 if(saved.has(id)){saved.delete(id);button.textContent="☆ Save"}else{saved.add(id);button.textContent="★ Saved"}
 localStorage.setItem("iliam_saved_posts",JSON.stringify([...saved]));
}
</script>
</body>
</html>
